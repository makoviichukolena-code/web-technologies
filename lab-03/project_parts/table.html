
<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 1 - Таблиця</title>
    <style>
        body {
        <a href="../index.html">Повернутись на головну</a>
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 20px;
        }
        /* Зовнішня таблиця */
        .table-box {
            margin: 0 auto;
            border-collapse: collapse;
            border: 2px solid #000000;
            width: 450px;
            height: 450px;
        }
        .table-box td {
            border: 2px solid #000000;
            padding: 0;
        }
        /* Кольори*/
        .turquoise {
            background-color: #20c997;
        }
        .cream {
            background-color: #fffde7;
        }
        .red {
            background-color: #ff3b30;
        }
        .blue {
            background-color: #007aff;
        }
        .green {
            background-color: #34c759;
        }
        .yellow {
            background-color: #ffcc00;
        }

        .back-link {
            margin-top: 25px;
            display: inline-block;
            font-size: 16px;
            text-decoration: none;
            color: #0066cc;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h1>Завдання 1: Таблиця</h1>

<table class="table-box">
    <!-- 1 рядок: верхня бірюзова смуга -->
    <tr>
        <td colspan="3" class="turquoise" style="height: 50px;"></td>
    </tr>

    <!-- 2 рядок: середина -->
    <tr>
        <td class="cream" style="width: 70px;"></td>
        <td>
            <!-- Внутрішня таблиця-контейнер -->
            <table style="width: 100%; height: 100%; border-collapse: collapse;">
                <tr>
                    <td colspan="3" class="turquoise" style="height: 35px;"></td>
                </tr>
                <tr>
                    <td class="cream" style="width: 50px;"></td>
                    <td>
                        <!-- Ще одна внутрішня таблиця -->
                        <table style="width: 100%; height: 100%; border-collapse: collapse;">
                            <tr>
                                <td colspan="3" class="turquoise" style="height: 25px;"></td>
                            </tr>
                            <tr>
                                <td class="cream" style="width: 35px;"></td>
                                <td>
                                    <!-- Центральні 4 квадрати -->
                                    <table style="width: 100%; height: 100%; border-collapse: collapse;">
                                        <tr>
                                            <td class="red" style="width: 50%; height: 50%;"></td>
                                            <td class="blue" style="width: 50%; height: 50%;"></td>
                                        </tr>
                                        <tr>
                                            <td class="green" style="width: 50%; height: 50%;"></td>
                                            <td class="yellow" style="width: 50%; height: 50%;"></td>
                                        </tr>
                                    </table>
                                </td>
                                <td class="cream" style="width: 35px;"></td>
                            </tr>
                            <tr>
                                <td colspan="3" class="turquoise" style="height: 25px;"></td>
                            </tr>
                        </table>
                    </td>
                    <td class="cream" style="width: 50px;"></td>
                </tr>
                <tr>
                    <td colspan="3" class="turquoise" style="height: 35px;"></td>
                </tr>
            </table>
        </td>
        <td class="cream" style="width: 70px;"></td>
    </tr>

    <!-- 3 рядок: нижня бірюзова смуга -->
    <tr>
        <td colspan="3" class="turquoise" style="height: 50px;"></td>
    </tr>
</table>

<div>
    <a class="back-link" href="../index.html">Повернутись на головну</a>
</div>

</body>
</html>
