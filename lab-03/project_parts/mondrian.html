<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 2 - Картина Піта Мондріана</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 20px;
        }
        /* Картина-таблиця з чорними товстими рамками */
        .mondrian-table {
            margin: 0 auto;
            border-collapse: collapse;
            border: 4px solid #000000;
            width: 400px;
            height: 400px;
        }
        .mondrian-table td {
            border: 3px solid #000000;
            padding: 0;
        }
        /* Кольори згідно з завданням */
        .yellow {
            background-color: #fffa69;
        }
        .blue {
            background-color: #074481;
        }
        .red {
            background-color: #ff5b2d;
        }
        .black {
            background-color: #000000;
        }
        .white {
            background-color: #ffffff;
        }

        .back-link {
            margin-top: 30px;
            display: inline-block;
            font-size: 16px;
            text-decoration: none;
            color: #0066cc;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h1>Завдання 2: Картина Піта Мондріана</h1>

<table class="mondrian-table">
    <!-- 1 рядок -->
    <tr>
        <td class="white" style="width: 25%;"></td>
        <td class="white" style="width: 20%;"></td>
        <td class="white" style="width: 15%;"></td>
        <td class="yellow" style="width: 40%;"></td>
    </tr>
    <!-- 2 рядок -->
    <tr>
        <td class="white"></td>
        <td colspan="2" rowspan="2" class="red"></td>
        <td class="white"></td>
    </tr>
    <!-- 3 рядок -->
    <tr>
        <td class="black"></td>
        <td class="white"></td>
    </tr>
    <!-- 4 рядок -->
    <tr>
        <td class="yellow"></td>
        <td class="white"></td>
        <td class="blue" colspan="2"></td>
    </tr>
</table>

<div>
    <a class="back-link" href="../index.html">Повернутись на головну</a>
</div>

</body>
</html>
